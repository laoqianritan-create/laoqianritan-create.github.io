      color: #C9CDD4;
      transition: color .18s;

    .sm-card:hover .sm-card-head .sm-arrow { color: #E65A56; }

    .sm-card-body {
      height: 160px;
      padding: 4px;
      background: #fff;
      position: relative;
    }
    .sm-card-body .sm-fail {
      position: absolute; inset: 0;
      display: flex; align-items: center; justify-content: center;

    }
