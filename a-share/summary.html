  <style>
    /* ─── 汇总页专属 ─── */
    .summary-hero {
      padding: 26px 18px 6px;
      max-width: 1280px;
      margin: 0 auto;
      display: flex;
      align-items: baseline;
      gap: 14px;
      flex-wrap: wrap;
    }
    .summary-hero h2 { font-size: 24px; font-weight: 700; margin: 0; }
    .summary-hero .sm-date { font-size: 13px; color: #888; }
    .sm-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 14px;
      padding: 14px 18px 8px;
      max-width: 1280px;
      margin: 0 auto;
    }
    .sm-card {
      display: block;
      background: #fff;
      border: 1px solid #eee;
      border-radius: 10px;
      overflow: hidden;
      text-decoration: none;
      transition: box-shadow .15s, transform .15s;
    }
    .sm-card:hover { box-shadow: 0 6px 18px rgba(0,0,0,.10); transform: translateY(-2px); }
    .sm-card .sm-thumb {
      width: 100%;
      background:
        linear-gradient(135deg, #f0f1f4 0%, #fafbfc 55%, #f0f1f4 100%);
      aspect-ratio: 16 / 10;
      object-fit: contain;
      display: block;
      position: relative;
    }
    .sm-card .sm-thumb:not([src])::after,
    .sm-card .sm-thumb[src=""]::after {
      content: '';
      position: absolute;
      inset: 0;
      background:
        linear-gradient(100deg, transparent 30%, rgba(255,255,255,.75) 50%, transparent 70%);
      background-size: 220% 100%;
      animation: sm-shimmer 1.4s linear infinite;
    }
    @keyframes sm-shimmer {
      from { background-position: 120% 0; }
      to   { background-position: -120% 0; }
    }
    .sm-card .sm-thumb:not([src])::before,
    .sm-card .sm-thumb[src=""]::before {
      content: '⌛ 图表生成中…';
      position: absolute;
      inset: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      color: #b0b4bc;
      font-size: 13px;
      z-index: 1;
    }
    .sm-card .sm-title {
      font-size: 14px;
      color: #222;
      font-weight: 600;
      padding: 10px 12px 12px;
      border-top: 1px solid #f2f2f2;
    }
    .sm-card .sm-title svg { vertical-align: -2px; margin-right: 4px; color: #999; }
    .sm-loading { text-align: center; color: #999; padding: 60px 0; font-size: 14px; }
    @media (max-width: 900px) { .sm-grid { grid-template-columns: repeat(2, 1fr); } }
    @media (max-width: 560px)  { .sm-grid { grid-template-columns: 1fr; } }

    /* 隐藏渲染容器（只用于离屏生成缩略图，不占布局） */
    .sm-render-stage {
      position: absolute;
      left: -20000px;
      top: 0;
      width: 800px;
      pointer-events: none;
    }
    .sm-render-stage canvas { display: block; }

    /* 顶部导航「汇总」当前高亮 */
    .site-nav a.nav-summary { color: #E65A56; font-weight: 600; }
  </style>
