<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>历年自由现金流 · 预览</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Noto Sans SC", "PingFang SC", sans-serif;
      background: #f5f5f5;
      padding: 20px;
    }
    .panel {
      max-width: 1500px;
      margin: 0 auto;
      background: #fff;
      border-radius: 12px;
      padding: 30px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.05);
    }
    .panel-title {
      font-size: 28px;
      font-weight: 700;
      color: #222;
      margin-bottom: 8px;
    }
    .panel-desc {
      font-size: 15px;
      color: #888;
      margin-bottom: 24px;
    }
    .input-row {
      display: flex;
      gap: 12px;
      margin-bottom: 20px;
    }
    input[type="text"] {
      flex: 1;
      padding: 12px 16px;
      border: 1px solid #ddd;
      border-radius: 8px;
      font-size: 15px;
      outline: none;
    }
    input[type="text"]:focus {
      border-color: #5AAEF3;
    }
    button {
      padding: 12px 28px;
      background: #E65A56;
      color: #fff;
      border: none;
      border-radius: 8px;
      font-size: 15px;
      cursor: pointer;
    }
    button:hover {
      background: #d54a46;
    }
    .loading, .error {
      padding: 20px;
      text-align: center;
      color: #888;
    }
    .error {
      color: #E65A56;
    }
    .chart-wrap {
      position: relative;
    }
    #cfCanvas {
      width: 100%;
      max-width: 1400px;
      margin: 0 auto;
      display: block;
      cursor: crosshair;
    }
    .tooltip {
      position: absolute;
      background: rgba(0,0,0,0.85);
      color: #fff;
      padding: 10px 14px;
      border-radius: 6px;
      font-size: 13px;
      line-height: 1.6;
      pointer-events: none;
      display: none;
      z-index: 10;
      white-space: nowrap;
    }
    .preview-tag {
      display: inline-block;
      background: #FFDC4C;
      color: #333;
      font-size: 12px;
      padding: 2px 8px;
      border-radius: 4px;
      margin-left: 12px;
      vertical-align: middle;
    }
  </style>
</head>
<body>
  <div class="panel">
    <h1 class="panel-title">历年自由现金流 <span class="preview-tag">预览版</span></h1>
    <p class="panel-desc">输入公司名或 6 位代码 · 自由现金流瀑布图（8 项指标）</p>

    <div class="input-row">
      <input type="text" id="cfQueryInput" placeholder="公司名 / 6 位代码，如：万华化学 / 600309" autocomplete="off" />
      <button id="cfQueryBtn">计算</button>
    </div>

    <div id="cfLoading" class="loading" hidden>计算中 · 约 10-30 秒...</div>
    <div id="cfError" class="error" hidden></div>
    <div class="chart-wrap" id="chartWrap" hidden>
      <canvas id="cfCanvas"></canvas>
      <div class="tooltip" id="cfTooltip"></div>
    </div>
  </div>

  <script>
    const API = 'https://ashare.laoqianriritan.com';
    const input = document.getElementById('cfQueryInput');
    const btn = document.getElementById('cfQueryBtn');
    const loading = document.getElementById('cfLoading');
    const errBox = document.getElementById('cfError');
    const chartWrap = document.getElementById('chartWrap');
    const canvas = document.getElementById('cfCanvas');
    const tooltip = document.getElementById('cfTooltip');
    const ctx = canvas.getContext('2d');

    let _data = null;
    let _hidden = {};
    let _hoverIndex = -1;

    // 8个指标配置
    const INDICATORS = [
      { key: 'tax_operating_profit', name: '税后营业利润', color: '#23C2DB' },
      { key: 'depreciation', name: '折旧摊销', color: '#B09CDB' },
      { key: 'working_capital_change', name: '营运资本变动', color: '#5AAEF3' },
      { key: 'capex', name: '资本支出', color: '#FFB366' },
      { key: 'free_cashflow', name: '自由现金流', color: '#E65A56' },
      { key: 'dividend_paid', name: '计划股息支付', color: '#8C9BAE' },
      { key: 'new_equity', name: '新股权融资', color: '#FFDC4C' },
      { key: 'net_debt', name: '净债权融资', color: '#7CB342' },
    ];

    function hideAll() {
      loading.hidden = true;
      errBox.hidden = true;
      chartWrap.hidden = true;
    }

    async function requestCashflow(q) {
      const url = API + '/cashflow?q=' + encodeURIComponent(q.trim());
      const resp = await fetch(url, { cache: 'no-store' });
      if (!resp.ok) {
        let msg = '请求失败（' + resp.status + '）';
        try { const j = await resp.json(); if (j && j.error) msg = j.error; } catch (e) {}
        throw new Error(msg);
      }
      return resp.json();
    }

    function getChartMetrics() {
      const W = 1400, H = 650;
      const padL = 70, padR = 40, padT = 80, padB = 50;
      return { W, H, padL, padR, padT, padB };
    }

    function calcYRange(data) {
      const { W, H, padL, padR, padT, padB } = getChartMetrics();
      const years = data.years;
      const n = years.length;

      let yMin = 0, yMax = 0;
      years.forEach((year, i) => {
        let running = 0;
        const v1 = data.tax_operating_profit[i];
        if (v1 !== null && v1 !== undefined && !_hidden['tax_operating_profit']) running += v1;
        if (running > yMax) yMax = running;
        if (running < yMin) yMin = running;

        const v2 = data.depreciation[i];
        if (v2 !== null && v2 !== undefined && !_hidden['depreciation']) running += v2;
        if (running > yMax) yMax = running;
        if (running < yMin) yMin = running;

        const v3 = data.working_capital_change[i];
        if (v3 !== null && v3 !== undefined && !_hidden['working_capital_change']) running += v3;
        if (running > yMax) yMax = running;
        if (running < yMin) yMin = running;

        const v4 = data.capex[i];
        if (v4 !== null && v4 !== undefined && !_hidden['capex']) running -= v4;
        if (running > yMax) yMax = running;
        if (running < yMin) yMin = running;

        const v6 = data.dividend_paid[i];
        if (v6 !== null && v6 !== undefined && !_hidden['dividend_paid']) running -= v6;
        if (running > yMax) yMax = running;
        if (running < yMin) yMin = running;

        const v7 = data.new_equity[i];
        if (v7 !== null && v7 !== undefined && !_hidden['new_equity']) running += v7;
        if (running > yMax) yMax = running;
        if (running < yMin) yMin = running;

        const v8 = data.net_debt[i];
        if (v8 !== null && v8 !== undefined && !_hidden['net_debt']) running += v8;
        if (running > yMax) yMax = running;
        if (running < yMin) yMin = running;
      });

      const yPad = (yMax - yMin) * 0.15 || 10;
      yMin -= yPad; yMax += yPad;
      return { yMin, yMax };
    }

    function draw(data) {
      const { W, H, padL, padR, padT, padB } = getChartMetrics();
      const { yMin, yMax } = calcYRange(data);

      canvas.width = W * window.devicePixelRatio;
      canvas.height = H * window.devicePixelRatio;
      canvas.style.width = '100%';
      canvas.style.height = 'auto';
      ctx.setTransform(window.devicePixelRatio, 0, 0, window.devicePixelRatio, 0, 0);
      ctx.fillStyle = '#FFFFFF';
      ctx.fillRect(0, 0, W, H);

      const years = data.years;
      const n = years.length;
      if (n === 0) return;

      const xs = (i) => padL + (n === 1 ? 0.5 : i / (n - 1)) * (W - padL - padR);
      const ys = (v) => padT + (1 - (v - yMin) / (yMax - yMin)) * (H - padT - padB);

      // 网格线
      ctx.strokeStyle = '#EDEDED';
      ctx.lineWidth = 1;
      const gridCount = 5;
      for (let i = 0; i <= gridCount; i++) {
        const v = yMin + (yMax - yMin) * i / gridCount;
        const y = ys(v);
        ctx.beginPath();
        ctx.moveTo(padL, y);
        ctx.lineTo(W - padR, y);
        ctx.stroke();
        ctx.fillStyle = '#999';
        ctx.font = '12px sans-serif';
        ctx.textAlign = 'right';
        ctx.textBaseline = 'middle';
        ctx.fillText(v.toFixed(0), padL - 10, y);
      }

      // 0轴（加粗）
      ctx.strokeStyle = '#999';
      ctx.lineWidth = 1.5;
      const y0 = ys(0);
      ctx.beginPath();
      ctx.moveTo(padL, y0);
      ctx.lineTo(W - padR, y0);
      ctx.stroke();

      // x轴年份
      ctx.fillStyle = '#999';
      ctx.font = '12px sans-serif';
      ctx.textAlign = 'center';
      ctx.textBaseline = 'top';
      years.forEach((year, i) => {
        if (i % 3 === 0 || i === n - 1) {
          ctx.fillText(year, xs(i), H - padB + 10);
        }
      });

      // 画瀑布图
      const barWidth = (W - padL - padR) / n * 0.5;

      years.forEach((year, i) => {
        const x = xs(i) - barWidth / 2;
        let running = 0;

        // 步骤1：税后营业利润
        const v1 = data.tax_operating_profit[i];
        if (v1 !== null && v1 !== undefined && !_hidden['tax_operating_profit']) {
          const y1 = ys(running);
          const y2 = ys(running + v1);
          ctx.fillStyle = INDICATORS[0].color;
          ctx.fillRect(x, Math.min(y1, y2), barWidth, Math.abs(y1 - y2));
          running += v1;
        }

        // 步骤2：折旧摊销
        const v2 = data.depreciation[i];
        if (v2 !== null && v2 !== undefined && !_hidden['depreciation']) {
          const y1 = ys(running);
          const y2 = ys(running + v2);
          ctx.fillStyle = INDICATORS[1].color;
          ctx.fillRect(x, Math.min(y1, y2), barWidth, Math.abs(y1 - y2));
          running += v2;
        }

        // 步骤3：营运资本变动
        const v3 = data.working_capital_change[i];
        if (v3 !== null && v3 !== undefined && !_hidden['working_capital_change']) {
          const y1 = ys(running);
          const y2 = ys(running + v3);
          ctx.fillStyle = INDICATORS[2].color;
          ctx.fillRect(x, Math.min(y1, y2), barWidth, Math.abs(y1 - y2));
          running += v3;
        }

        // 步骤4：资本支出（向下减）
        const v4 = data.capex[i];
        if (v4 !== null && v4 !== undefined && !_hidden['capex']) {
          const y1 = ys(running);
          const y2 = ys(running - v4);
          ctx.fillStyle = INDICATORS[3].color;
          ctx.fillRect(x, Math.min(y1, y2), barWidth, Math.abs(y1 - y2));
          running -= v4;
        }

        // 自由现金流位置标记（红色横线）
        const fcf = data.free_cashflow[i];
        if (fcf !== null && fcf !== undefined) {
          const yFcf = ys(fcf);
          ctx.strokeStyle = INDICATORS[4].color;
          ctx.lineWidth = 2;
          ctx.beginPath();
          ctx.moveTo(x - 4, yFcf);
          ctx.lineTo(x + barWidth + 4, yFcf);
          ctx.stroke();
        }

        // 步骤6：计划股息支付（向下减）
        const v6 = data.dividend_paid[i];
        if (v6 !== null && v6 !== undefined && !_hidden['dividend_paid']) {
          const y1 = ys(running);
          const y2 = ys(running - v6);
          ctx.fillStyle = INDICATORS[5].color;
          ctx.fillRect(x, Math.min(y1, y2), barWidth, Math.abs(y1 - y2));
          running -= v6;
        }

        // 步骤7：新股权融资
        const v7 = data.new_equity[i];
        if (v7 !== null && v7 !== undefined && !_hidden['new_equity']) {
          const y1 = ys(running);
          const y2 = ys(running + v7);
          ctx.fillStyle = INDICATORS[6].color;
          ctx.fillRect(x, Math.min(y1, y2), barWidth, Math.abs(y1 - y2));
          running += v7;
        }

        // 步骤8：净债权融资
        const v8 = data.net_debt[i];
        if (v8 !== null && v8 !== undefined && !_hidden['net_debt']) {
          const y1 = ys(running);
          const y2 = ys(running + v8);
          ctx.fillStyle = INDICATORS[7].color;
          ctx.fillRect(x, Math.min(y1, y2), barWidth, Math.abs(y1 - y2));
          running += v8;
        }
      });

      // hover参考线
      if (_hoverIndex >= 0 && _hoverIndex < n) {
        const x = xs(_hoverIndex);
        ctx.strokeStyle = '#999';
        ctx.lineWidth = 1;
        ctx.setLineDash([4, 4]);
        ctx.beginPath();
        ctx.moveTo(x, padT);
        ctx.lineTo(x, H - padB);
        ctx.stroke();
        ctx.setLineDash([]);
      }

      // 图例（可点击）
      const legendY = 30;
      let legendX = W / 2 - INDICATORS.length * 60 / 2;
      ctx.font = '13px sans-serif';
      ctx.textAlign = 'left';
      ctx.textBaseline = 'middle';

      INDICATORS.forEach((ind, idx) => {
        const isHidden = _hidden[ind.key];
        ctx.fillStyle = isHidden ? '#CCC' : ind.color;
        ctx.fillRect(legendX, legendY - 6, 12, 12);
        ctx.fillStyle = isHidden ? '#CCC' : '#333';
        ctx.fillText(ind.name, legendX + 18, legendY);
        ind._legendX = legendX; // 记录位置用于点击检测
        ind._legendW = 18 + ctx.measureText(ind.name).width + 20;
        legendX += ind._legendW;
      });

      // 标题
      ctx.fillStyle = '#333';
      ctx.font = 'bold 18px sans-serif';
      ctx.textAlign = 'left';
      ctx.textBaseline = 'top';
      ctx.fillText(data.name + ' · 历年自由现金流（亿元）', padL, 20);

      // 单位标注
      ctx.fillStyle = '#999';
      ctx.font = '12px sans-serif';
      ctx.textAlign = 'left';
      ctx.textBaseline = 'top';
      ctx.fillText('单位：亿元', padL + 5, padT - 20);

      _data = data;
    }

    // hover交互
    canvas.onmousemove = function(e) {
      if (!_data) return;
      const rect = canvas.getBoundingClientRect();
      const scale = canvas.width / window.devicePixelRatio / rect.width;
      const mx = (e.clientX - rect.left) * scale;
      const my = (e.clientY - rect.top) * scale;

      const { W, H, padL, padR, padT, padB } = getChartMetrics();
      const years = _data.years;
      const n = years.length;

      // 先检测是否点在图例上
      let legendClicked = -1;
      INDICATORS.forEach((ind, idx) => {
        if (my > 15 && my < 45 && mx > ind._legendX && mx < ind._legendX + ind._legendW) {
          legendClicked = idx;
        }
      });

      if (legendClicked >= 0) {
        canvas.style.cursor = 'pointer';
        tooltip.style.display = 'none';
        return;
      }

      canvas.style.cursor = 'crosshair';

      // 找到最近的年份
      const i = Math.round((mx - padL) / ((W - padL - padR) / (n - 1)));
      if (i < 0 || i >= n) {
        _hoverIndex = -1;
        tooltip.style.display = 'none';
        draw(_data);
        return;
      }

      if (_hoverIndex !== i) {
        _hoverIndex = i;
        draw(_data);
      }

      // 显示tooltip
      let html = '<strong>' + years[i] + ' 年</strong><br>';
      INDICATORS.forEach(ind => {
        const v = _data[ind.key][i];
        const color = _hidden[ind.key] ? '#999' : ind.color;
        if (v !== null && v !== undefined) {
          html += '<span style="color:' + color + '">■</span> ' + ind.name + ': ' + v.toFixed(2) + ' 亿<br>';
        } else {
          html += '<span style="color:#999">■</span> ' + ind.name + ': -<br>';
        }
      });

      tooltip.innerHTML = html;
      tooltip.style.display = 'block';

      // 定位tooltip
      const wrapRect = chartWrap.getBoundingClientRect();
      const canvasRect = canvas.getBoundingClientRect();
      let tooltipX = (e.clientX - wrapRect.left) + 15;
      let tooltipY = (e.clientY - wrapRect.top) - 10;

      // 防止超出右边界
      if (tooltipX + 200 > wrapRect.width) {
        tooltipX = (e.clientX - wrapRect.left) - 210;
      }

      tooltip.style.left = tooltipX + 'px';
      tooltip.style.top = tooltipY + 'px';
    };

    canvas.onmouseleave = function() {
      _hoverIndex = -1;
      tooltip.style.display = 'none';
      if (_data) draw(_data);
    };

    // 图例点击切换
    canvas.onclick = function(e) {
      if (!_data) return;
      const rect = canvas.getBoundingClientRect();
      const scale = canvas.width / window.devicePixelRatio / rect.width;
      const mx = (e.clientX - rect.left) * scale;
      const my = (e.clientY - rect.top) * scale;

      INDICATORS.forEach((ind, idx) => {
        if (my > 15 && my < 45 && mx > ind._legendX && mx < ind._legendX + ind._legendW) {
          if (_hidden[ind.key]) {
            delete _hidden[ind.key];
          } else {
            _hidden[ind.key] = true;
          }
          draw(_data);
        }
      });
    };

    // 绑定事件
    btn.addEventListener('click', async function() {
      const q = input.value.trim();
      if (!q) return;
      hideAll();
      loading.hidden = false;
      try {
        const data = await requestCashflow(q);
        if (data.error) throw new Error(data.error);
        _hidden = {};
        _hoverIndex = -1;
        draw(data);
        chartWrap.hidden = false;
        loading.hidden = true;
      } catch (e) {
        errBox.textContent = e.message;
        errBox.hidden = false;
        loading.hidden = true;
      }
    });

    input.addEventListener('keydown', function(e) {
      if (e.key === 'Enter') btn.click();
    });
  </script>
</body>
</html>
