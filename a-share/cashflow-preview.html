<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>历年自由现金流 · 预览</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Noto Sans SC", "PingFang SC", sans-serif;
      background: #f5f5f5;
      padding: 20px;
    }
    .panel {
      max-width: 1500px;
      margin: 0 auto;
      background: #fff;
      border-radius: 12px;
      padding: 30px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.05);
    }
    .panel-title {
      font-size: 28px;
      font-weight: 700;
      color: #222;
      margin-bottom: 8px;
    }
    .panel-desc {
      font-size: 15px;
      color: #888;
      margin-bottom: 24px;
    }
    .input-row {
      display: flex;
      gap: 12px;
      margin-bottom: 20px;
    }
    input[type="text"] {
      flex: 1;
      padding: 12px 16px;
      border: 1px solid #ddd;
      border-radius: 8px;
      font-size: 15px;
      outline: none;
    }
    input[type="text"]:focus {
      border-color: #5AAEF3;
    }
    button {
      padding: 12px 28px;
      background: #E65A56;
      color: #fff;
      border: none;
      border-radius: 8px;
      font-size: 15px;
      cursor: pointer;
    }
    button:hover {
      background: #d54a46;
    }
    .loading, .error {
      padding: 20px;
      text-align: center;
      color: #888;
    }
    .error {
      color: #E65A56;
    }
    #cfCanvas {
      width: 100%;
      max-width: 1400px;
      margin: 0 auto;
      display: block;
    }
    .preview-tag {
      display: inline-block;
      background: #FFDC4C;
      color: #333;
      font-size: 12px;
      padding: 2px 8px;
      border-radius: 4px;
      margin-left: 12px;
      vertical-align: middle;
    }
  </style>
</head>
<body>
  <div class="panel">
    <h1 class="panel-title">历年自由现金流 <span class="preview-tag">预览版</span></h1>
    <p class="panel-desc">输入公司名或 6 位代码 · 自由现金流瀑布图（8 项指标）</p>

    <div class="input-row">
      <input type="text" id="cfQueryInput" placeholder="公司名 / 6 位代码，如：茅台 / 600519" autocomplete="off" />
      <button id="cfQueryBtn">计算</button>
    </div>

    <div id="cfLoading" class="loading" hidden>计算中 · 约 10-30 秒...</div>
    <div id="cfError" class="error" hidden></div>
    <canvas id="cfCanvas" hidden></canvas>
  </div>

  <script>
    const API = 'https://ashare.laoqianriritan.com';
    const input = document.getElementById('cfQueryInput');
    const btn = document.getElementById('cfQueryBtn');
    const loading = document.getElementById('cfLoading');
    const errBox = document.getElementById('cfError');
    const canvas = document.getElementById('cfCanvas');

    let _data = null;
    let _hidden = {};

    const INDICATORS = [
      { key: 'tax_operating_profit', name: '税后营业利润', color: '#23C2DB' },
      { key: 'depreciation', name: '折旧摊销', color: '#B09CDB' },
      { key: 'working_capital_change', name: '营运资本变动', color: '#5AAEF3' },
      { key: 'capex', name: '资本支出', color: '#FFB366' },
      { key: 'free_cashflow', name: '自由现金流', color: '#E65A56' },
      { key: 'dividend_paid', name: '计划股息支付', color: '#8C9BAE' },
      { key: 'new_equity', name: '新股权融资', color: '#FFDC4C' },
      { key: 'net_debt', name: '净债权融资', color: '#7CB342' },
    ];

    function hideAll() {
      loading.hidden = true;
      errBox.hidden = true;
      canvas.hidden = true;
    }

    async function requestCashflow(q) {
      const url = API + '/cashflow?q=' + encodeURIComponent(q.trim());
      const resp = await fetch(url, { cache: 'no-store' });
      if (!resp.ok) {
        let msg = '请求失败（' + resp.status + '）';
        try { const j = await resp.json(); if (j && j.error) msg = j.error; } catch (e) {}
        throw new Error(msg);
      }
      return resp.json();
    }

    function draw(data) {
      const W = 1400, H = 650;
      const padL = 70, padR = 40, padT = 80, padB = 50;
      canvas.width = W * window.devicePixelRatio;
      canvas.height = H * window.devicePixelRatio;
      canvas.style.width = '100%';
      canvas.style.height = 'auto';
      const ctx = canvas.getContext('2d');
      ctx.setTransform(window.devicePixelRatio, 0, 0, window.devicePixelRatio, 0, 0);
      ctx.fillStyle = '#FFFFFF';
      ctx.fillRect(0, 0, W, H);

      const years = data.years;
      const n = years.length;
      if (n === 0) return;

      // 计算y范围
      let yMin = 0, yMax = 0;
      INDICATORS.forEach(ind => {
        if (_hidden[ind.key]) return;
        const vals = data[ind.key] || [];
        vals.forEach(v => {
          if (v === null || v === undefined) return;
          if (v > yMax) yMax = v;
          if (v < yMin) yMin = v;
        });
      });
      const yPad = (yMax - yMin) * 0.15 || 10;
      yMin -= yPad; yMax += yPad;

      const xs = (i) => padL + (n === 1 ? 0.5 : i / (n - 1)) * (W - padL - padR);
      const ys = (v) => padT + (1 - (v - yMin) / (yMax - yMin)) * (H - padT - padB);

      // 网格线
      ctx.strokeStyle = '#EDEDED';
      ctx.lineWidth = 1;
      const gridCount = 5;
      for (let i = 0; i <= gridCount; i++) {
        const v = yMin + (yMax - yMin) * i / gridCount;
        const y = ys(v);
        ctx.beginPath();
        ctx.moveTo(padL, y);
        ctx.lineTo(W - padR, y);
        ctx.stroke();
        ctx.fillStyle = '#999';
        ctx.font = '12px sans-serif';
        ctx.textAlign = 'right';
        ctx.textBaseline = 'middle';
        ctx.fillText(v.toFixed(0), padL - 10, y);
      }

      // x轴年份
      ctx.fillStyle = '#999';
      ctx.font = '12px sans-serif';
      ctx.textAlign = 'center';
      ctx.textBaseline = 'top';
      years.forEach((year, i) => {
        if (i % 3 === 0 || i === n - 1) {
          ctx.fillText(year, xs(i), H - padB + 10);
        }
      });

      // 画柱子
      const barWidth = (W - padL - padR) / n * 0.6;

      years.forEach((year, i) => {
        const x = xs(i) - barWidth / 2;
        let posStack = 0;
        let negStack = 0;

        INDICATORS.forEach(ind => {
          if (_hidden[ind.key]) return;
          const v = data[ind.key][i];
          if (v === null || v === undefined) return;

          if (v >= 0) {
            const y1 = ys(posStack);
            const y2 = ys(posStack + v);
            ctx.fillStyle = ind.color;
            ctx.fillRect(x, y2, barWidth, y1 - y2);
            posStack += v;
          } else {
            const y1 = ys(negStack);
            const y2 = ys(negStack + v);
            ctx.fillStyle = ind.color;
            ctx.fillRect(x, y1, barWidth, y2 - y1);
            negStack += v;
          }
        });
      });

      // 图例
      const legendY = 30;
      let legendX = W / 2 - INDICATORS.length * 60 / 2;
      ctx.font = '13px sans-serif';
      ctx.textAlign = 'left';
      ctx.textBaseline = 'middle';

      INDICATORS.forEach(ind => {
        const isHidden = _hidden[ind.key];
        ctx.fillStyle = isHidden ? '#CCC' : ind.color;
        ctx.fillRect(legendX, legendY - 6, 12, 12);
        ctx.fillStyle = isHidden ? '#CCC' : '#333';
        ctx.fillText(ind.name, legendX + 18, legendY);
        legendX += 18 + ctx.measureText(ind.name).width + 20;
      });

      // 标题
      ctx.fillStyle = '#333';
      ctx.font = 'bold 18px sans-serif';
      ctx.textAlign = 'left';
      ctx.textBaseline = 'top';
      ctx.fillText(data.name + ' · 历年自由现金流（亿元）', padL, 20);

      _data = data;
    }

    // hover交互
    canvas.onmousemove = function(e) {
      if (!_data) return;
      const rect = canvas.getBoundingClientRect();
      const scale = canvas.width / window.devicePixelRatio / rect.width;
      const mx = (e.clientX - rect.left) * scale;

      const W = 1400, H = 650;
      const padL = 70, padR = 40, padT = 80, padB = 50;
      const years = _data.years;
      const n = years.length;

      const i = Math.round((mx - padL) / ((W - padL - padR) / (n - 1)));
      if (i < 0 || i >= n) return;

      const xs = (i) => padL + (n === 1 ? 0.5 : i / (n - 1)) * (W - padL - padR);
      const x = xs(i);

      draw(_data);

      const ctx = canvas.getContext('2d');
      ctx.setTransform(window.devicePixelRatio, 0, 0, window.devicePixelRatio, 0, 0);

      // 纵向参考线
      ctx.strokeStyle = '#999';
      ctx.lineWidth = 1;
      ctx.setLineDash([4, 4]);
      ctx.beginPath();
      ctx.moveTo(x, padT);
      ctx.lineTo(x, H - padB);
      ctx.stroke();
      ctx.setLineDash([]);

      // tooltip
      let tooltip = years[i] + '年\n';
      INDICATORS.forEach(ind => {
        if (_hidden[ind.key]) return;
        const v = _data[ind.key][i];
        if (v !== null && v !== undefined) {
          tooltip += ind.name + ': ' + v.toFixed(2) + '亿\n';
        }
      });
      canvas.title = tooltip;
    };

    // 绑定事件
    btn.addEventListener('click', async function() {
      const q = input.value.trim();
      if (!q) return;
      hideAll();
      loading.hidden = false;
      try {
        const data = await requestCashflow(q);
        if (data.error) throw new Error(data.error);
        _hidden = {};
        draw(data);
        canvas.hidden = false;
        loading.hidden = true;
      } catch (e) {
        errBox.textContent = e.message;
        errBox.hidden = false;
        loading.hidden = true;
      }
    });

    input.addEventListener('keydown', function(e) {
      if (e.key === 'Enter') btn.click();
    });
  </script>
</body>
</html>
